services:
  backend:
    build: ./backend
    command: uvicorn src.main:app --host 0.0.0.0 --reload --port 8000
    container_name: backend
    volumes:
      - ./backend:/backend
      - backend-storage:/backend/storage
    env_file: ".env"
    ports:
      - "8000:8000"
    depends_on:
      backend-db:
        condition: service_healthy
      backend-redis:
        condition: service_healthy

  backend-worker:
    build: ./backend
    command: [ 'celery', '-A', 'src.worker.celery_app.celery_app', 'worker', '-l', 'info',
               '--uid', 'nobody', '--concurrency=1' ]
    container_name: backend-worker
    env_file: ".env"
    # --uid nobody drops root, but HOME still points at /root (mode 700), which
    # nobody can't even traverse. asyncpg's connect path stats $HOME/.postgresql/*
    # while negotiating SSL and dies with PermissionError before a query is ever
    # sent. Point HOME at a directory nobody can read so the connection succeeds.
    #
    # --concurrency=1: a single worker process is what makes
    # tests/test_worker_loop.py meaningful — every task is guaranteed to run
    # sequentially in the same process, so a regression back to the process-wide
    # pool in src/core/db.py shows up immediately instead of only on a lucky
    # single-core run. The workload here (one UPDATE plus one INSERT per task)
    # doesn't need more, and worker_prefetch_multiplier=1 already keeps the
    # queue from backing up.
    environment:
      HOME: /tmp
    volumes:
      - ./backend:/backend
    depends_on:
      backend-db:
        condition: service_healthy
      backend-redis:
        condition: service_healthy

  backend-beat:
    build: ./backend
    command: [ 'celery', '-A', 'src.worker.celery_app.celery_app', 'beat', '-l', 'info' ]
    container_name: backend-beat
    env_file: ".env"
    volumes:
      - ./backend:/backend
    depends_on:
      backend-redis:
        condition: service_healthy

  backend-db:
    image: postgres:18
    container_name: backend-db
    env_file: ".env"
    volumes:
      - backend-db-volume:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -p $${PGPORT}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend-redis:
    image: redis:8
    container_name: backend-redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  backend-db-volume:
  backend-storage:
